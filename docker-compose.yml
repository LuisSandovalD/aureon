services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aureon
      POSTGRES_USER: aureon
      POSTGRES_PASSWORD: aureon
    ports:
      - "5432:5432"
    volumes:
      - aureon_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aureon -d aureon"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    ports:
      - "11434:11434"
    volumes:
      - aureon_ollama:/root/.ollama

volumes:
  aureon_postgres:
  aureon_ollama:
